<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Galerie</title>

  <!-- Minimalist + modern: system font stack + subtle shadows -->
  <style>
    :root{
      --bg: #ffffff;
      --bg2: #f6f7fb;
      --card: #ffffff;
      --text: rgba(17,24,39,0.92);
      --muted: rgba(17,24,39,0.62);
      --muted2: rgba(17,24,39,0.46);
      --border: rgba(17,24,39,0.10);
      --shadow: 0 12px 28px rgba(17,24,39,0.10);
      --accent: #2563eb; /* blue */
      --danger:#ef4444;
      --ring: 0 0 0 4px rgba(37,99,235,0.18);
      --radius: 18px;
      --radius2: 14px;
      --maxw: 1240px;
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(37,99,235,0.10), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(14,165,233,0.08), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      line-height: 1.45;
    }

    a{ color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible, input:focus-visible{ outline: none; box-shadow: var(--ring); border-color: rgba(124,58,237,0.55) !important; }

    .wrap{ max-width: var(--maxw); margin: 0 auto; padding: 28px 20px 44px; }

    /* Gate-only minimalist layout */
    #page.gate-only{
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px;
    }

    #page.gate-only header,
    #page.gate-only #app,
    #page.gate-only .lb{
      display:none !important;
    }

    #page.gate-only #gate{
      width: min(520px, 100%);
      margin: 0 !important;
    }

    #page.gate-only #gateMsg{ display:none !important; }

    .btn.success{
      background: linear-gradient(180deg, rgba(34,197,94,0.95), rgba(34,197,94,0.78));
      border-color: rgba(34,197,94,0.55);
      color: white;
    }

    .btn.danger{
      background: linear-gradient(180deg, rgba(239,68,68,0.95), rgba(239,68,68,0.78));
      border-color: rgba(239,68,68,0.55);
      color: white;
    }

    /* Placeholder coloring */
    input::placeholder{ color: rgba(17,24,39,0.45); }
    input.error::placeholder{ color: rgb(239,68,68); }

    header{
      display:flex; gap:16px; align-items:flex-start; justify-content: space-between;
      margin-bottom: 18px;
    }

    .title{
      display:flex; flex-direction: column; gap: 6px;
    }

    h1{
      font-size: 20px; letter-spacing: 0.2px; margin:0;
      font-weight: 680;
    }

    .subtitle{ display:none; }

    .toolbar{
      display:flex; flex-wrap: wrap; gap:10px; align-items:center; justify-content: flex-end;
    }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
      color: var(--text);
      font-size: 13px;
      user-select: none;
    }

    .pill strong{ font-weight: 650; }

    .btn{
      cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 13px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      white-space: nowrap;
    }

    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,0.09); border-color: rgba(17,24,39,0.16); }
    .btn:active{ transform: translateY(0px); }

    /* Keep semantic buttons stable on hover */
    .btn.primary:hover{ background: linear-gradient(180deg, rgba(37,99,235,0.95), rgba(37,99,235,0.78)); border-color: rgba(37,99,235,0.85); }
    .btn.success:hover{ background: linear-gradient(180deg, rgba(34,197,94,0.95), rgba(34,197,94,0.78)); border-color: rgba(34,197,94,0.75); }
    .btn.danger:hover{ background: linear-gradient(180deg, rgba(239,68,68,0.95), rgba(239,68,68,0.78)); border-color: rgba(239,68,68,0.75); }

    .btn.primary{
      background: linear-gradient(180deg, rgba(37,99,235,0.95), rgba(37,99,235,0.78));
      border-color: rgba(37,99,235,0.55);
      color: white;
    }

    .btn.primary:hover{ border-color: rgba(37,99,235,0.85); }

    .btn.ghost{ background: rgba(255,255,255,0.03); }

    .btn:disabled{ opacity: 0.5; cursor:not-allowed; transform:none; }

    .controls{ display:none; }

    @media (max-width: 900px){
      .controls{ grid-template-columns: 1fr; }
      header{ flex-direction: column; align-items: stretch; }
      .toolbar{ justify-content: flex-start; }
    }

    .field{
      display:flex; align-items:center; gap:10px;
      padding: 10px 12px;
      border-radius: var(--radius2);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
    }

    .field label{ font-size: 12px; color: var(--muted2); min-width: 74px; }

    input[type="search"]{
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
    }

    select{
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      appearance: none;
    }

    .hint{ font-size: 12px; color: var(--muted); }

    .grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    @media (max-width: 1100px){ .grid{ grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 780px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px){ .grid{ grid-template-columns: 1fr; } }

    .card{
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
      cursor: zoom-in;
      min-height: 140px;
    }

    .card:hover{ transform: translateY(-2px); border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); }

    .thumb{
      width:100%;
      height: 260px;
      object-fit: cover;
      display:block;
      background: rgba(17,24,39,0.03);
    }

    @media (max-width: 780px){ .thumb{ height: 220px; } }
    @media (max-width: 520px){ .thumb{ height: 240px; } }

    .meta{ display:none; }
    .caption{ display:none; }
    .badges{ display:none; }
    .badge{ display:none; }

    .state{
      margin-top: 18px;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      padding: 18px;
      color: var(--muted);
      background: rgba(255,255,255,0.03);
    }

    /* Lightbox */
    .lb{
      position: fixed; inset: 0;
      background: rgba(17,24,39,0.32);
      display:none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      z-index: 50;
    }

    .lb.open{ display:flex; }

    .lb-inner{
      width: min(1180px, 100%);
      max-height: min(86vh, 980px);
      border-radius: 22px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      overflow: hidden;
      color: var(--text);
    }

    .lb-top{
      display:flex; align-items:center; justify-content: space-between; gap: 10px;
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.65);
    }

    /* Mobile lightbox layout: title on top, buttons below image */
    @media (max-width: 640px){
      .lb{ padding: 14px; }
      .lb-inner{ max-height: 92vh; }
      .lb-top{ padding: 10px 10px; }
      .lb-actions{ display:none; }
      .lb-title .name{ font-size: 13px; }
      .lb-title .sub{ display:none; }
      .lb-img{ max-height: 62vh; }
      .lb-bottom{
        display:flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: space-between;
        padding: 10px;
        border-top: 1px solid var(--border);
        background: rgba(255,255,255,0.65);
      }
      .lb-bottom .btn{ flex: 1 1 auto; justify-content:center; }
    }

    .lb-title{ display:flex; flex-direction: column; min-width: 0; }
    .lb-title .name{ font-size: 13px; font-weight: 680; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
    .lb-title .sub{ font-size: 12px; color: var(--muted); white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }

    .lb-actions{ display:flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .lb-img-wrap{
      display:flex; align-items:center; justify-content:center;
      background: linear-gradient(180deg, rgba(246,247,251,0.85), rgba(255,255,255,0.85));
    }
    .lb-img{
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display:block;
      background: transparent;
    }

    /* (old kbd helper hidden anyway) */
    .kbd{ display:none; }

    /* Footer */
    footer{ margin-top: 24px; display:flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    footer a{ text-decoration: underline; text-underline-offset: 3px; color: var(--muted); }

    /* Small icons (inline SVG) */
    .ico{ width: 16px; height: 16px; display:inline-block; }
    .ico path{ fill: currentColor; }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce){
      .btn, .card{ transition: none; }
    }
  </style>
</head>

<body>
  <div class="wrap" id="page">
    <!-- Login gate (client-side) -->
    <section id="gate">
      <div style="border:1px solid var(--border); background: var(--card); border-radius: 22px; padding: 18px; box-shadow: var(--shadow);">
        <div style="display:flex; gap: 10px; align-items: stretch;">
          <input id="pw" type="password" aria-label="Passwort" placeholder="Passwort" autocomplete="current-password"
                 style="flex:1; border:1px solid var(--border); background: #fff; border-radius: 16px; padding: 14px 14px; font-size: 14px; color: var(--text); caret-color: var(--text);" />
          <button class="btn primary" id="unlockBtn" type="button" aria-label="Bestätigen" style="width: 56px; padding: 0;">
            <span id="unlockIconOk" style="display:inline-flex; align-items:center; justify-content:center;">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px;">
                <path d="M20.285 6.709a1.35 1.35 0 0 1 0 1.91l-9.06 9.06a1.35 1.35 0 0 1-1.91 0L3.715 12.08a1.35 1.35 0 0 1 1.91-1.91l4.645 4.645 8.105-8.105a1.35 1.35 0 0 1 1.91 0Z" fill="currentColor"/>
              </svg>
            </span>
            <span id="unlockIconBad" style="display:none; align-items:center; justify-content:center;">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px;">
                <path d="M17.657 6.343a1.35 1.35 0 0 1 0 1.91L13.91 12l3.747 3.747a1.35 1.35 0 1 1-1.91 1.91L12 13.91l-3.747 3.747a1.35 1.35 0 1 1-1.91-1.91L10.09 12 6.343 8.253a1.35 1.35 0 1 1 1.91-1.91L12 10.09l3.747-3.747a1.35 1.35 0 0 1 1.91 0Z" fill="currentColor"/>
              </svg>
            </span>
          </button>
        </div>
        <div id="gateMsg"></div>
      </div>
    </section>

    <div id="app" style="display:none">
      <header>
        <div class="title">
          <h1>Galerie</h1>
        </div>
        <div class="toolbar">
          <div class="pill" id="countPill">Lade…</div>
          <a class="btn ghost" id="zipLink" href="#" aria-disabled="true" title="ZIP-Datei (optional)" >
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4.01 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.42-1.41L11 11.6V3a1 1 0 0 1 1-1ZM5 20a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/></svg>
            Alle als ZIP
          </a>
          <button class="btn primary" id="reloadBtn" type="button">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 0 1-8.66 3.54 1 1 0 1 0-1.5 1.32A7 7 0 0 0 19 13c0-3.87-3.13-7-7-7Z"/></svg>
            Neu laden
          </button>
        </div>
      </header>


      <main>
        <div id="state" class="state" style="display:none"></div>
        <div id="grid" class="grid" aria-live="polite"></div>
      </main>

      <footer style="display:none"></footer>
    </div>
  </div>

  <!--
    Repo structure expected:
      - index.html
      - assets/images/            (originals)
      - assets/thumbs/            (optional; same filenames as originals)
      - data/images.json          (auto-generated by GitHub Action)
      - tools/generate-images-json.mjs
      - .github/workflows/build-images-json.yml
  -->

  <!-- Lightbox -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Bildansicht">
    <div class="lb-inner">
      <div class="lb-top">
        <div class="lb-title">
          <div class="name" id="lbName">—</div>
          <div class="sub" id="lbSub">—</div>
        </div>
        <div class="lb-actions">
          <a class="btn" id="lbDownload" href="#" download>
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4.01 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.42-1.41L11 11.6V3a1 1 0 0 1 1-1ZM5 20a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/></svg>
            Download
          </a>
          <button class="btn ghost" id="lbPrev" type="button" title="Vorheriges (←)">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.7 6.3a1 1 0 0 1 0 1.4L11.41 12l4.3 4.3a1 1 0 1 1-1.41 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.4 0Z"/></svg>
            Zurück
          </button>
          <button class="btn ghost" id="lbNext" type="button" title="Nächstes (→)">
            Weiter
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.3 17.7a1 1 0 0 1 0-1.4L12.59 12 8.3 7.7a1 1 0 1 1 1.41-1.4l5 5a1 1 0 0 1 0 1.4l-5 5a1 1 0 0 1-1.4 0Z"/></svg>
          </button>
          <button class="btn" id="lbClose" type="button" title="Schließen (Esc)">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.3 6.3a1 1 0 0 1 1.4 0L12 10.6l4.3-4.3a1 1 0 1 1 1.4 1.4L13.4 12l4.3 4.3a1 1 0 1 1-1.4 1.4L12 13.4l-4.3 4.3a1 1 0 1 1-1.4-1.4L10.6 12 6.3 7.7a1 1 0 0 1 0-1.4Z"/></svg>
            Schließen
          </button>
        </div>
      </div>
      <div class="lb-img-wrap">
        <img id="lbImg" class="lb-img" alt="" />
      </div>

      <div class="lb-bottom" style="display:none" id="lbBottom">
        <a class="btn" id="lbDownload2" href="#" download>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4.01 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.42-1.41L11 11.6V3a1 1 0 0 1 1-1ZM5 20a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/></svg>
          Download
        </a>
        <button class="btn ghost" id="lbPrev2" type="button">Zurück</button>
        <button class="btn ghost" id="lbNext2" type="button">Weiter</button>
        <button class="btn" id="lbClose2" type="button">Schließen</button>
      </div>
    </div>
  </div>

  <!-- JSZip (for optional on-the-fly ZIP build) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script>
    // ----- Config -----
    // If you prefer a pre-built ZIP file in the repo, set zipFile to e.g. "downloads/images.zip" in images.json.
    const IMAGES_JSON_URL = "data/images.json";

    // Simple client-side password gate (NOT high security).
    // Anyone who can view page source can technically extract this.
    const GALLERY_PASSWORD = "Bilder123";

    // ----- State -----
    let allItems = [];
    let viewItems = [];
    let activeIndex = -1;

    // ----- Elements -----
    const gateEl = document.getElementById('gate');
    const gateMsgEl = document.getElementById('gateMsg');
    const pwEl = document.getElementById('pw');
    const unlockBtn = document.getElementById('unlockBtn');
    const unlockIconOk = document.getElementById('unlockIconOk');
    const unlockIconBad = document.getElementById('unlockIconBad');
    const appEl = document.getElementById('app');

    const gridEl = document.getElementById('grid');
    const stateEl = document.getElementById('state');
    const countPillEl = document.getElementById('countPill');
    const reloadBtn = document.getElementById('reloadBtn');
    const zipLink = document.getElementById('zipLink');

    // Lightbox
    const lb = document.getElementById('lb');
    const lbImg = document.getElementById('lbImg');
    const lbName = document.getElementById('lbName');
    const lbSub = document.getElementById('lbSub');
    const lbDownload = document.getElementById('lbDownload');
    const lbClose = document.getElementById('lbClose');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');

    // Mobile bottom bar
    const lbBottom = document.getElementById('lbBottom');
    const lbDownload2 = document.getElementById('lbDownload2');
    const lbClose2 = document.getElementById('lbClose2');
    const lbPrev2 = document.getElementById('lbPrev2');
    const lbNext2 = document.getElementById('lbNext2');

    // ----- Helpers -----
    const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function fileNameFromPath(p){
      try{
        const clean = String(p || '').split('?')[0].split('#')[0];
        const parts = clean.split('/');
        return parts[parts.length-1] || clean;
      } catch { return 'image'; }
    }

    function normalizeItem(raw){
      // Accept either: string or object
      if (typeof raw === 'string') {
        return { src: raw, title: fileNameFromPath(raw), tags: [] };
      }
      const src = raw.src || raw.url || '';
      const title = raw.title || raw.name || fileNameFromPath(src);
      const tags = Array.isArray(raw.tags) ? raw.tags : (raw.tags ? [String(raw.tags)] : []);
      const date = raw.date || raw.created || raw.taken || '';
      const description = raw.description || '';
      const thumb = raw.thumb || raw.thumbnail || '';
      return { src, title, tags, date, description, thumb };
    }

    function parseDateMaybe(v){
      if (!v) return null;
      const d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    }

    function unique(arr){ return [...new Set(arr)]; }

    function setState(msg, show=true){
      stateEl.style.display = show ? 'block' : 'none';
      stateEl.textContent = msg || '';
    }

    function setCountPill(){
      const total = allItems.length;
      const shown = viewItems.length;
      const label = shown === total ? `${total} Bilder` : `${shown} von ${total} Bildern`;
      countPillEl.innerHTML = `<strong>${esc(label)}</strong>`;
    }

    // Clean mode: no search/filter/sort UI.
    function setViewAll(){
      viewItems = allItems.slice();
      render();
    }

    function render(){
      setCountPill();
      setState('', false);
      gridEl.innerHTML = '';

      if (!viewItems.length){
        setState('Keine Bilder gefunden.', true);
        return;
      }

      const frag = document.createDocumentFragment();
      for (let idx=0; idx<viewItems.length; idx++){
        const it = viewItems[idx];
        const card = document.createElement('article');
        card.className = 'card';
        card.tabIndex = 0;
        card.setAttribute('role','button');
        card.setAttribute('aria-label', `Bild öffnen: ${it.title}`);

        const img = document.createElement('img');
        img.className = 'thumb';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = it.thumb || it.src;
        img.alt = it.title || '';

        const meta = document.createElement('div');
        meta.className = 'meta';

        const cap = document.createElement('div');
        cap.className = 'caption';
        const sub = [it.tags && it.tags.length ? it.tags.slice(0,2).join(' · ') : '', it.date ? String(it.date) : ''].filter(Boolean).join(' · ');
        cap.innerHTML = `<div class="name">${esc(it.title || fileNameFromPath(it.src))}</div><div class="sub">${esc(sub || fileNameFromPath(it.src))}</div>`;

        const badges = document.createElement('div');
        badges.className = 'badges';
        if (it.tags && it.tags.length){
          badges.appendChild(makeBadge(it.tags.length === 1 ? it.tags[0] : `${it.tags.length} Tags`));
        }

        meta.appendChild(cap);
        meta.appendChild(badges);

        card.appendChild(img);
        card.appendChild(meta);

        card.addEventListener('click', ()=> openLightbox(idx));
        card.addEventListener('keydown', (e)=>{
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openLightbox(idx);
          }
        });

        frag.appendChild(card);
      }
      gridEl.appendChild(frag);
    }

    function makeBadge(txt){
      const b = document.createElement('div');
      b.className = 'badge';
      b.textContent = txt;
      return b;
    }

    function openLightbox(viewIdx){
      activeIndex = viewIdx;
      const it = viewItems[activeIndex];
      if (!it) return;

      lb.classList.add('open');
      // prevent background scroll
      document.documentElement.style.overflow = 'hidden';

      lbImg.src = it.src;
      lbImg.alt = it.title || '';

      const tags = (it.tags && it.tags.length) ? it.tags.join(', ') : '';
      const date = it.date ? String(it.date) : '';
      lbName.textContent = it.title || fileNameFromPath(it.src);
      lbSub.textContent = [tags, date].filter(Boolean).join(' · ');

      lbDownload.href = it.src;
      lbDownload.setAttribute('download', fileNameFromPath(it.src));
      if (lbDownload2){
        lbDownload2.href = it.src;
        lbDownload2.setAttribute('download', fileNameFromPath(it.src));
      }

      // show mobile bottom bar only on small screens (CSS handles layout)
      if (lbBottom){
        lbBottom.style.display = '';
      }
    }

    function closeLightbox(){
      lb.classList.remove('open');
      document.documentElement.style.overflow = '';
      // clear image to stop download in some browsers
      lbImg.src = '';
      if (lbBottom) lbBottom.style.display = 'none';
      activeIndex = -1;
    }

    function stepLightbox(delta){
      if (activeIndex < 0) return;
      const next = activeIndex + delta;
      if (next < 0 || next >= viewItems.length) return;
      openLightbox(next);
    }

    // ZIP handling
    async function buildZipOnTheFly(){
      // Warning: this downloads all images in the browser. Works for moderate sizes.
      const btn = zipLink;
      btn.textContent = 'ZIP wird erstellt…';
      btn.classList.add('primary');
      btn.setAttribute('aria-disabled','true');
      btn.style.pointerEvents = 'none';

      try{
        const zip = new JSZip();
        const folder = zip.folder('images');
        const items = allItems.slice();

        // Simple throttling: sequential fetch avoids spiking memory/network.
        for (let i=0; i<items.length; i++){
          const it = items[i];
          const res = await fetch(it.src);
          if (!res.ok) throw new Error(`Konnte Datei nicht laden: ${it.src}`);
          const blob = await res.blob();
          folder.file(fileNameFromPath(it.src), blob);
          btn.textContent = `ZIP: ${i+1}/${items.length}…`;
        }

        const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
        const url = URL.createObjectURL(zipBlob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'images.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(()=> URL.revokeObjectURL(url), 15_000);

        btn.textContent = 'Alle als ZIP';
      } finally {
        btn.classList.remove('primary');
        btn.setAttribute('aria-disabled','false');
        btn.style.pointerEvents = '';
      }
    }

    function configureZipOption(manifest){
      // If manifest provides a ready-made zip file, use it as simple link.
      const zipFile = manifest && (manifest.zipFile || manifest.zip || manifest.downloadZip);
      if (zipFile){
        zipLink.href = zipFile;
        zipLink.setAttribute('download', fileNameFromPath(zipFile));
        zipLink.setAttribute('aria-disabled','false');
        zipLink.style.pointerEvents = '';
        zipLink.addEventListener('click', (e)=>{
          // normal navigation/download
        }, { once: true });
      } else {
        // On-the-fly zip build
        zipLink.href = '#';
        zipLink.setAttribute('aria-disabled','false');
        zipLink.style.pointerEvents = '';
        zipLink.addEventListener('click', async (e)=>{
          e.preventDefault();
          await buildZipOnTheFly();
        }, { once: false });
      }
    }

    // ----- Gate -----
    function setGateMsg(text, isError=false){
      // Gate is intentionally minimal: keep messages visually hidden.
      gateMsgEl.textContent = text || '';
      gateMsgEl.style.color = isError ? 'var(--danger)' : 'var(--muted)';
    }

    async function unlock(){
      const entered = String(pwEl.value || '');
      const ok = entered === GALLERY_PASSWORD;

      if (!ok){
        // show inline error inside the field
        pwEl.value = '';
        pwEl.placeholder = 'Falsches Passwort';
        pwEl.classList.add('error');
        pwEl.style.borderColor = 'rgba(239,68,68,0.55)';
        pwEl.style.color = 'var(--text)';
        pwEl.style.caretColor = 'var(--text)';

        unlockBtn.classList.remove('primary','success');
        unlockBtn.classList.add('danger');
        if (unlockIconOk) unlockIconOk.style.display = 'none';
        if (unlockIconBad) unlockIconBad.style.display = 'inline-flex';

        pwEl.focus();
        return;
      }

      // reset field visuals
      pwEl.placeholder = 'Passwort';
      pwEl.classList.remove('error');
      pwEl.style.borderColor = '';
      pwEl.style.color = '';

      // turn button green briefly, then open app
      unlockBtn.classList.remove('primary','danger');
      unlockBtn.classList.add('success');
      if (unlockIconOk) unlockIconOk.style.display = 'inline-flex';
      if (unlockIconBad) unlockIconBad.style.display = 'none';
      unlockBtn.disabled = true;

      await new Promise(r => setTimeout(r, 220));

      gateEl.style.display = 'none';
      appEl.style.display = '';
      document.getElementById('page')?.classList.remove('gate-only');
      load();
    }

    unlockBtn.addEventListener('click', unlock);
    pwEl.addEventListener('input', ()=>{
      // reset error styling once user starts typing again
      pwEl.placeholder = 'Passwort';
      pwEl.classList.remove('error');
      pwEl.style.borderColor = '';
      pwEl.style.color = '';
      unlockBtn.classList.remove('danger','success');
      unlockBtn.classList.add('primary');
      if (unlockIconOk) unlockIconOk.style.display = 'inline-flex';
      if (unlockIconBad) unlockIconBad.style.display = 'none';
    });

    pwEl.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter') unlock();
    });

    // ----- Events -----
    reloadBtn.addEventListener('click', async ()=>{
      await load();
    });

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', ()=> stepLightbox(-1));
    lbNext.addEventListener('click', ()=> stepLightbox(1));

    if (lbClose2) lbClose2.addEventListener('click', closeLightbox);
    if (lbPrev2) lbPrev2.addEventListener('click', ()=> stepLightbox(-1));
    if (lbNext2) lbNext2.addEventListener('click', ()=> stepLightbox(1));

    lb.addEventListener('click', (e)=>{
      if (e.target === lb) closeLightbox();
    });

    document.addEventListener('keydown', (e)=>{
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') stepLightbox(-1);
      if (e.key === 'ArrowRight') stepLightbox(1);
    });

    // ----- Data load -----
    async function load(){
      setState('Lade images.json …', true);
      countPillEl.textContent = 'Lade…';
      gridEl.innerHTML = '';

      try{
        const res = await fetch(IMAGES_JSON_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Konnte ${IMAGES_JSON_URL} nicht laden (HTTP ${res.status}).`);
        const manifest = await res.json();

        // Allow two formats:
        // 1) Array directly
        // 2) { images: [...], zipFile: "downloads/images.zip" }
        const arr = Array.isArray(manifest) ? manifest : (manifest.images || []);
        if (!Array.isArray(arr)) throw new Error('images.json hat ein unerwartetes Format. Erwartet: Array oder { images: [...] }.');

        allItems = arr.map(normalizeItem).filter(i => i.src);

        configureZipOption(manifest);

        // Clean mode: show everything
        setViewAll();

        setState('', false);
        if (!allItems.length){
          setState('Keine Bilder gefunden.', true);
        }

      } catch (err){
        setState(String(err?.message || err), true);
        console.error(err);
      }
    }

    // Start locked; fully minimal gate-only view.
    document.getElementById('page')?.classList.add('gate-only');
    setGateMsg('');
    appEl.style.display = 'none';

  </script>
</body>
