name: Build images.json

on:
  push:
    branches: [ "main" ]
    paths:
      - "assets/images/**"
      - "assets/thumbs/**"
      - "tools/**"
      - ".github/workflows/build-images-json.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate data/images.json
        run: node tools/generate-images-json.mjs

      - name: Commit changes (if any)
        run: |
          set -e
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/images.json
          git commit -m "chore: update images.json"
          git push
